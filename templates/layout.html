<!DOCTYPE html>
<html>
<head>
<!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
  <header class="site-header">
    <nav class="navbar navbar-expand-lg wellness-navbar fixed-top">
      <div class="container">

        <a class="navbar-brand wellness-logo" href="/">
          <i class="bi bi-gem me-2"></i>RUBY
        </a>

        
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#wellnessNavbar" aria-controls="wellnessNavbar" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="wellnessNavbar">
          <div class="navbar-nav mx-auto">
            <a class="nav-link" href="/">Home</a>
            <a class="nav-link" href="/recipe">Recipes</a>
            <a class="nav-link" href="#">Drug Comparison</a>
            <a class="nav-link" href="#">Routine</a>
            <a class="nav-link" href="#">Cart</a>
          </div>

          <div class="navbar-nav navbar-actions">
            <a class="nav-link login-link" href="/login">Login</a>
            <a class="signup-button" href="/register">Sign Up</a>
          </div>

        </div>
      </div>
    </nav>
  </header>
    
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }}">
            {{ message }}
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <main role="main">
      {% block content %}{% endblock %}
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</body>
</html>
